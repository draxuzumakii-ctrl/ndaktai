<html>
<head>
<meta charset="UTF-8">

<style>
* { margin:0; padding:0; }
html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    top:0;
    left:0;
    background:black;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    pointer-events:none;
}
#blocker {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:99999;
    background:transparent;
    pointer-events:auto;
    touch-action:none;
}
.strobe {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:99998;
    background:white;
    animation: flash 0.03s infinite alternate;
    pointer-events:none;
    mix-blend-mode:difference;
}
@keyframes flash {
    0% { opacity:1; }
    100% { opacity:0; }
}
.colorburst {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:99997;
    pointer-events:none;
    animation: colorcycle 0.1s infinite;
}
@keyframes colorcycle {
    0% { background:red; opacity:0.3; }
    20% { background:blue; opacity:0.5; }
    40% { background:lime; opacity:0.2; }
    60% { background:magenta; opacity:0.6; }
    80% { background:yellow; opacity:0.4; }
    100% { background:cyan; opacity:0.7; }
}
#noiseCanvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:99996;
    pointer-events:none;
    opacity:0.9;
}
.glitch {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:100000;
    color:#ff00ff;
    font-size:clamp(30px,10vw,80px);
    font-weight:900;
    font-family:'Courier New',monospace;
    text-shadow:0 0 30px #ff00ff,0 0 60px #ff00ff,0 0 120px #ff00ff;
    animation:glitch 0.05s infinite;
    pointer-events:none;
    mix-blend-mode:screen;
    text-align:center;
    line-height:1.2;
}
@keyframes glitch {
    0% { transform:translate(-50%,-50%) skewX(2deg) skewY(1deg); opacity:1; }
    25% { transform:translate(-50%,-50%) skewX(-3deg) skewY(-2deg); opacity:0.8; }
    50% { transform:translate(-50%,-50%) skewX(5deg) skewY(3deg); opacity:0.9; }
    75% { transform:translate(-50%,-50%) skewX(-4deg) skewY(-1deg); opacity:0.7; }
    100% { transform:translate(-50%,-50%) skewX(1deg) skewY(-3deg); opacity:1; }
}
.fakeDialog {
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:100001;
    background:rgba(0,0,0,0.8);
    color:#ff4444;
    padding:15px 30px;
    border:2px solid #ff0000;
    border-radius:10px;
    font-family:monospace;
    font-size:14px;
    text-align:center;
    animation:pulse 0.3s infinite;
    pointer-events:none;
}
@keyframes pulse {
    0% { opacity:1; }
    50% { opacity:0.2; }
    100% { opacity:1; }
}
</style>
